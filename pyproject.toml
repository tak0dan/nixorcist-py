[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nixorcist"
version = "0.1.0"
description = "Higher-level Nix package/profile management and configuration promotion tool"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Nixorcist contributors" }]
keywords = ["nix", "nixos", "packages", "profiles", "nixpkgs"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Software Distribution",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
nixorcist = "nixorcist.cli.entry:main"
nist = "nixorcist.cli.entry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]